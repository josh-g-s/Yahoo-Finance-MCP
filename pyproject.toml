[project]
name = "yahoo-finance-mcp"
version = "0.1.0"
description = "A lightweight MCP server for Yahoo Finance data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.5.0",
  "yfinance>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
yahoo-finance-mcp = "yahoo_finance_mcp:main"
